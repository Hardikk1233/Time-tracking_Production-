openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Time Tracking API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: users
    description: User management
  - name: clients
    description: Client management
  - name: projects
    description: Project management
  - name: tasks
    description: Task management
  - name: time-entries
    description: Time entry logging and approval
  - name: dashboard
    description: Dashboard and analytics
  - name: holidays
    description: Public holiday management
  - name: leaves
    description: Employee leave management
  - name: reports
    description: Custom reports (AVP and MD only)

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── Auth ───────────────────────────────────────────────────────────────
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Log out
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── Users ──────────────────────────────────────────────────────────────
  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all users
      parameters:
        - name: role
          in: query
          schema:
            type: string
            enum: [analyst, associate, avp, md]
        - name: reportingToId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      operationId: createUser
      tags: [users]
      summary: Create a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{userId}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get a user
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: User found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update a user
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    delete:
      operationId: deleteUser
      tags: [users]
      summary: Delete a user
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  # ─── Clients ────────────────────────────────────────────────────────────
  /clients:
    get:
      operationId: listClients
      tags: [clients]
      summary: List all clients
      responses:
        "200":
          description: List of clients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Client"
    post:
      operationId: createClient
      tags: [clients]
      summary: Create a client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"

  /clients/{clientId}:
    get:
      operationId: getClient
      tags: [clients]
      summary: Get a client
      parameters:
        - $ref: "#/components/parameters/ClientId"
      responses:
        "200":
          description: Client found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateClient
      tags: [clients]
      summary: Update a client
      parameters:
        - $ref: "#/components/parameters/ClientId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
    delete:
      operationId: deleteClient
      tags: [clients]
      summary: Delete a client
      parameters:
        - $ref: "#/components/parameters/ClientId"
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /clients/{clientId}/assignments:
    get:
      operationId: listClientAssignments
      tags: [clients]
      summary: List users assigned to a client
      parameters:
        - $ref: "#/components/parameters/ClientId"
      responses:
        "200":
          description: Assigned users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      operationId: assignUserToClient
      tags: [clients]
      summary: Assign a user to a client
      parameters:
        - $ref: "#/components/parameters/ClientId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserAssignmentInput"
      responses:
        "200":
          description: Assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /clients/{clientId}/assignments/{userId}:
    delete:
      operationId: removeUserFromClient
      tags: [clients]
      summary: Remove a user from a client
      parameters:
        - $ref: "#/components/parameters/ClientId"
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  # ─── Projects ───────────────────────────────────────────────────────────
  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List projects
      parameters:
        - name: clientId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"

  /projects/{projectId}:
    get:
      operationId: getProject
      tags: [projects]
      summary: Get a project
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Project found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Update a project
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: Delete a project
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /projects/{projectId}/assignments:
    get:
      operationId: listProjectAssignments
      tags: [projects]
      summary: List users assigned to a project
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Assigned users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      operationId: assignUserToProject
      tags: [projects]
      summary: Assign a user to a project
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserAssignmentInput"
      responses:
        "200":
          description: Assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /projects/{projectId}/assignments/{userId}:
    delete:
      operationId: removeUserFromProject
      tags: [projects]
      summary: Remove a user from a project
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /projects/{projectId}/tasks:
    get:
      operationId: listProjectTasks
      tags: [projects]
      summary: List tasks enabled for a project
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Tasks enabled for the project
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
    post:
      operationId: assignTaskToProject
      tags: [projects]
      summary: Enable a global task for a project
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskAssignmentInput"
      responses:
        "200":
          description: Assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /projects/{projectId}/tasks/{taskId}:
    delete:
      operationId: removeTaskFromProject
      tags: [projects]
      summary: Remove a task from a project
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  # ─── Tasks (global catalog) ────────────────────────────────────────────
  /tasks:
    get:
      operationId: listTasks
      tags: [tasks]
      summary: List tasks
      parameters:
        - name: projectId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
    post:
      operationId: createTask
      tags: [tasks]
      summary: Create a task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"

  /tasks/{taskId}:
    get:
      operationId: getTask
      tags: [tasks]
      summary: Get a task
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Task found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateTask
      tags: [tasks]
      summary: Update a task
      parameters:
        - $ref: "#/components/parameters/TaskId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
    delete:
      operationId: deleteTask
      tags: [tasks]
      summary: Delete a task
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  # ─── Time Entries ────────────────────────────────────────────────────────
  /time-entries:
    get:
      operationId: listTimeEntries
      tags: [time-entries]
      summary: List time entries
      parameters:
        - name: userId
          in: query
          schema:
            type: integer
        - name: taskId
          in: query
          schema:
            type: integer
        - name: projectId
          in: query
          schema:
            type: integer
        - name: clientId
          in: query
          schema:
            type: integer
        - name: startDate
          in: query
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          schema:
            type: string
            format: date
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, approved, rejected]
        - name: billable
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: List of time entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TimeEntry"
    post:
      operationId: createTimeEntry
      tags: [time-entries]
      summary: Log time
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TimeEntryInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeEntry"

  /time-entries/{entryId}:
    get:
      operationId: getTimeEntry
      tags: [time-entries]
      summary: Get a time entry
      parameters:
        - $ref: "#/components/parameters/EntryId"
      responses:
        "200":
          description: Time entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeEntry"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateTimeEntry
      tags: [time-entries]
      summary: Update a time entry
      parameters:
        - $ref: "#/components/parameters/EntryId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TimeEntryUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeEntry"
    delete:
      operationId: deleteTimeEntry
      tags: [time-entries]
      summary: Delete a time entry
      parameters:
        - $ref: "#/components/parameters/EntryId"
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /time-entries/{entryId}/split:
    post:
      operationId: splitTimeEntry
      tags: [time-entries]
      summary: Split entry hours into billable and non-billable (Associate+)
      parameters:
        - $ref: "#/components/parameters/EntryId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SplitHoursInput"
      responses:
        "200":
          description: Updated time entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeEntry"

  /time-entries/{entryId}/approve:
    post:
      operationId: approveTimeEntry
      tags: [time-entries]
      summary: Approve a time entry
      parameters:
        - $ref: "#/components/parameters/EntryId"
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeEntry"

  /time-entries/{entryId}/reject:
    post:
      operationId: rejectTimeEntry
      tags: [time-entries]
      summary: Reject a time entry
      parameters:
        - $ref: "#/components/parameters/EntryId"
      responses:
        "200":
          description: Rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeEntry"

  # ─── Dashboard ───────────────────────────────────────────────────────────
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Overall hours summary
      parameters:
        - name: startDate
          in: query
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/client-hours:
    get:
      operationId: getClientHours
      tags: [dashboard]
      summary: Hours breakdown per client
      parameters:
        - name: startDate
          in: query
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Client hours
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClientHours"

  /dashboard/utilization:
    get:
      operationId: getTeamUtilization
      tags: [dashboard]
      summary: Team member utilization
      parameters:
        - name: startDate
          in: query
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Utilization data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MemberUtilization"

  /dashboard/recent-activity:
    get:
      operationId: getRecentActivity
      tags: [dashboard]
      summary: Recent time entries across the team
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TimeEntry"

  /dashboard/client-hours-trend:
    get:
      operationId: getClientHoursTrend
      tags: [dashboard]
      summary: Billable/non-billable hours for a client bucketed by week or month
      parameters:
        - name: clientId
          in: query
          required: true
          schema:
            type: integer
        - name: startDate
          in: query
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          schema:
            type: string
            format: date
        - name: granularity
          in: query
          schema:
            type: string
            enum: [week, month]
            default: month
      responses:
        "200":
          description: Trend data points
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClientHoursTrendPoint"

  /dashboard/pending-approvals:
    get:
      operationId: getPendingApprovals
      tags: [dashboard]
      summary: Time entries pending approval
      responses:
        "200":
          description: Pending approvals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TimeEntry"

  # ─── Public Holidays ─────────────────────────────────────────────────────
  /public-holidays:
    get:
      operationId: listPublicHolidays
      tags: [holidays]
      summary: List all public holidays
      responses:
        "200":
          description: List of public holidays
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PublicHoliday"
    post:
      operationId: createPublicHoliday
      tags: [holidays]
      summary: Create a public holiday (MD only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicHolidayInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicHoliday"

  /public-holidays/{id}:
    delete:
      operationId: deletePublicHoliday
      tags: [holidays]
      summary: Delete a public holiday (MD only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  # ─── Leaves ──────────────────────────────────────────────────────────────
  /leaves:
    get:
      operationId: listLeaves
      tags: [leaves]
      summary: List leave entries
      parameters:
        - name: startDate
          in: query
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          schema:
            type: string
            format: date
        - name: userId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of leaves
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Leave"
    post:
      operationId: logLeave
      tags: [leaves]
      summary: Log a leave day
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeaveInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Leave"

  /leaves/bulk:
    post:
      operationId: logLeavesBulk
      tags: [leaves]
      summary: Log multiple leave days at once (skips duplicates)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeaveBulkInput"
      responses:
        "201":
          description: Bulk result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaveBulkResult"

  /leaves/{id}:
    delete:
      operationId: deleteLeave
      tags: [leaves]
      summary: Delete a leave entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  # ─── Reports (all authenticated roles; scope enforced server-side) ───────────
  /reports/filter-options:
    get:
      operationId: getReportFilterOptions
      tags: [reports]
      summary: Scoped filter options for the current user
      responses:
        "200":
          description: Scoped users, clients, and projects
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportFilterOptions"

  /reports/client-report:
    get:
      operationId: getClientReport
      tags: [reports]
      summary: Per-client utilization table (all windows) + optional monthly chart for one client
      parameters:
        - name: clientId
          in: query
          required: false
          schema:
            type: integer
        - name: startDate
          in: query
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Client report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientReport"

  /reports/team-report:
    get:
      operationId: getTeamReport
      tags: [reports]
      summary: Hours by Project and Task for selected users and clients
      parameters:
        - name: startDate
          in: query
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          schema:
            type: string
            format: date
        - name: userIds
          in: query
          schema:
            type: string
            description: Comma-separated user IDs
        - name: clientIds
          in: query
          schema:
            type: string
            description: Comma-separated client IDs
      responses:
        "200":
          description: Team report rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeamReportRow"

  /reports/my-report:
    get:
      operationId: getMyReport
      tags: [reports]
      summary: Current user's hours by Project and Task with utilization summary
      parameters:
        - name: startDate
          in: query
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Personal report with summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyReport"

components:
  parameters:
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: integer
    ClientId:
      name: clientId
      in: path
      required: true
      schema:
        type: integer
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: integer
    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        type: integer
    EntryId:
      name: entryId
      in: path
      required: true
      schema:
        type: integer

  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    MessageResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string

    # ─── Auth ────────────────────────────────────────────────────────────
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    # ─── Users ───────────────────────────────────────────────────────────
    User:
      type: object
      required: [id, name, email, role, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [analyst, associate, avp, md]
        reportingToId:
          type: ["integer", "null"]
        reportingToName:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    UserInput:
      type: object
      required: [name, email, password, role]
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
        role:
          type: string
          enum: [analyst, associate, avp, md]
        reportingToId:
          type: ["integer", "null"]

    UserUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        role:
          type: string
          enum: [analyst, associate, avp, md]
        reportingToId:
          type: ["integer", "null"]
        password:
          type: string
          minLength: 6

    # ─── Clients ─────────────────────────────────────────────────────────
    Client:
      type: object
      required: [id, name, fteCount, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        fteCount:
          type: number
          minimum: 0.1
          maximum: 100
          description: "Number of full-time equivalents; 1 FTE = 8h/day, 40h/week, 160h/month"
        createdAt:
          type: string
          format: date-time

    ClientInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        fteCount:
          type: number
          minimum: 0.1
          maximum: 100
          default: 1
        associateIds:
          type: array
          items:
            type: integer
          description: "IDs of Associates to assign as responsible"

    ClientUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: ["string", "null"]
        fteCount:
          type: number
          minimum: 0.1
          maximum: 100

    # ─── Projects ─────────────────────────────────────────────────────────
    Project:
      type: object
      required: [id, clientId, clientName, name, createdAt]
      properties:
        id:
          type: integer
        clientId:
          type: integer
        clientName:
          type: string
        name:
          type: string
        description:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    ProjectInput:
      type: object
      required: [clientId, name]
      properties:
        clientId:
          type: integer
        name:
          type: string
          minLength: 1
        description:
          type: string
        taskIds:
          type: array
          items:
            type: integer
          description: "Global tasks enabled for this project"
        userIds:
          type: array
          items:
            type: integer
          description: "Users who can access this project"

    ProjectUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: ["string", "null"]

    # ─── Tasks (global catalog) ──────────────────────────────────────────
    Task:
      type: object
      required: [id, name, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    TaskInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string

    TaskUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: ["string", "null"]

    # ─── Time Entries ─────────────────────────────────────────────────────
    TimeEntry:
      type: object
      required: [id, userId, userName, taskId, taskName, hours, date, status, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: integer
        userName:
          type: string
        userRole:
          type: string
        taskId:
          type: integer
        taskName:
          type: string
        projectId:
          type: ["integer", "null"]
          description: "null for legacy entries logged before tasks became a global catalog"
        projectName:
          type: ["string", "null"]
        clientId:
          type: ["integer", "null"]
        clientName:
          type: ["string", "null"]
        hours:
          type: number
        date:
          type: string
          format: date
        description:
          type: ["string", "null"]
        billableHours:
          type: ["number", "null"]
          description: "null = not yet split; 0..hours = explicitly split by Associate+"
        nonBillableHours:
          type: ["number", "null"]
          description: "computed: hours - billableHours; null if not yet split"
        status:
          type: string
          enum: [pending, approved, rejected]
        approvedById:
          type: ["integer", "null"]
        approvedByName:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    TimeEntryInput:
      type: object
      required: [projectId, taskId, hours, date]
      properties:
        projectId:
          type: integer
        taskId:
          type: integer
        hours:
          type: number
          minimum: 0.25
          maximum: 24
        date:
          type: string
          format: date
        description:
          type: string

    TimeEntryUpdate:
      type: object
      properties:
        hours:
          type: number
          minimum: 0.25
          maximum: 24
        date:
          type: string
          format: date
        description:
          type: ["string", "null"]

    SplitHoursInput:
      type: object
      required: [billableHours]
      properties:
        billableHours:
          type: number
          minimum: 0
          description: "Hours to mark as billable; remainder becomes non-billable"

    # ─── Assignments ──────────────────────────────────────────────────────
    UserAssignmentInput:
      type: object
      required: [userId]
      properties:
        userId:
          type: integer

    TaskAssignmentInput:
      type: object
      required: [taskId]
      properties:
        taskId:
          type: integer

    # ─── Dashboard ────────────────────────────────────────────────────────
    DashboardSummary:
      type: object
      required: [totalHours, billableHours, nonBillableHours, pendingApprovalCount, approvedHours]
      properties:
        totalHours:
          type: number
        billableHours:
          type: number
        nonBillableHours:
          type: number
        pendingApprovalCount:
          type: integer
        approvedHours:
          type: number
        workingDays:
          type: integer
        effectiveWorkingDays:
          type: integer
          description: "workingDays minus public holidays minus user leave days"
        leaveDays:
          type: integer
        capacityHours:
          type: number
          description: "effectiveWorkingDays × 8"
        utilization:
          type: number
          description: "billableHours / capacityHours × 100"

    ClientHours:
      type: object
      required: [clientId, clientName, totalHours, billableHours, nonBillableHours]
      properties:
        clientId:
          type: integer
        clientName:
          type: string
        totalHours:
          type: number
        billableHours:
          type: number
        nonBillableHours:
          type: number

    ClientHoursTrendPoint:
      type: object
      required: [period, label, billableHours, nonBillableHours, totalHours, workingDays, fteCount, capacity, utilization]
      properties:
        period:
          type: string
          description: "ISO key: YYYY-Www for weekly, YYYY-MM for monthly"
        label:
          type: string
          description: "Human-readable: 'Jan 2025' or 'W3 Jan'"
        billableHours:
          type: number
        nonBillableHours:
          type: number
        totalHours:
          type: number
        workingDays:
          type: integer
          description: "Working days minus public holidays"
        fteCount:
          type: number
        capacity:
          type: number
          description: "workingDays × 8 × fteCount"
        utilization:
          type: number
          description: "billableHours / capacity × 100"

    MemberUtilization:
      type: object
      required: [userId, userName, role, totalHours, billableHours, nonBillableHours, pendingHours, utilization, efficiency]
      properties:
        userId:
          type: integer
        userName:
          type: string
        role:
          type: string
          enum: [analyst, associate, avp, md]
        totalHours:
          type: number
        billableHours:
          type: number
        nonBillableHours:
          type: number
        pendingHours:
          type: number
        leaveDays:
          type: integer
        effectiveWorkingDays:
          type: integer
        utilization:
          type: number
          description: "billableHours / (effectiveWorkingDays × 8) × 100"
        efficiency:
          type: number
          description: "billableHours / totalHours × 100"

    # ─── Public Holidays ──────────────────────────────────────────────────
    PublicHoliday:
      type: object
      required: [id, date, name, createdAt]
      properties:
        id:
          type: integer
        date:
          type: string
          format: date
        name:
          type: string
        createdAt:
          type: string
          format: date-time

    PublicHolidayInput:
      type: object
      required: [date, name]
      properties:
        date:
          type: string
          format: date
        name:
          type: string

    # ─── Reports ─────────────────────────────────────────────────────────
    ReportFilterUser:
      type: object
      required: [id, name, role]
      properties:
        id:
          type: integer
        name:
          type: string
        role:
          type: string
          enum: [analyst, associate, avp, md]

    ReportFilterClient:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
        name:
          type: string

    ReportFilterProject:
      type: object
      required: [id, name, clientId]
      properties:
        id:
          type: integer
        name:
          type: string
        clientId:
          type: integer

    ReportFilterOptions:
      type: object
      required: [users, clients, projects]
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/ReportFilterUser"
        clients:
          type: array
          items:
            $ref: "#/components/schemas/ReportFilterClient"
        projects:
          type: array
          items:
            $ref: "#/components/schemas/ReportFilterProject"

    ClientPeriodStats:
      type: object
      required: [billableHours, contractedHours, utilization]
      properties:
        billableHours:
          type: number
        contractedHours:
          type: number
          description: "fteCount × workingDays × 8"
        utilization:
          type: number
          description: "billableHours / contractedHours × 100"

    ClientUtilizationRow:
      type: object
      required: [clientId, clientName, fteCount, selectedRange, last3m, last6m, last12m]
      properties:
        clientId:
          type: integer
        clientName:
          type: string
        fteCount:
          type: number
        selectedRange:
          $ref: "#/components/schemas/ClientPeriodStats"
        last3m:
          $ref: "#/components/schemas/ClientPeriodStats"
        last6m:
          $ref: "#/components/schemas/ClientPeriodStats"
        last12m:
          $ref: "#/components/schemas/ClientPeriodStats"

    MonthlyClientRow:
      type: object
      required: [month, billableHours, contractedHours, utilization]
      properties:
        month:
          type: string
          description: "YYYY-MM"
        billableHours:
          type: number
        contractedHours:
          type: number
        utilization:
          type: number

    ClientReport:
      type: object
      required: [clientSummary]
      properties:
        clientSummary:
          type: array
          items:
            $ref: "#/components/schemas/ClientUtilizationRow"
        monthlySummary:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/MonthlyClientRow"

    TeamReportRow:
      type: object
      required: [userId, userName, userRole, clientId, clientName, projectId, projectName, taskId, taskName, totalHours, billableHours, nonBillableHours, efficiency]
      properties:
        userId:
          type: integer
        userName:
          type: string
        userRole:
          type: string
          enum: [analyst, associate, avp, md]
        clientId:
          type: integer
        clientName:
          type: string
        projectId:
          type: integer
        projectName:
          type: string
        taskId:
          type: integer
        taskName:
          type: string
        totalHours:
          type: number
        billableHours:
          type: number
        nonBillableHours:
          type: number
        efficiency:
          type: number
          description: "billableHours / totalHours × 100"

    MyReportRow:
      type: object
      required: [clientId, clientName, projectId, projectName, taskId, taskName, totalHours, billableHours, nonBillableHours]
      properties:
        clientId:
          type: integer
        clientName:
          type: string
        projectId:
          type: integer
        projectName:
          type: string
        taskId:
          type: integer
        taskName:
          type: string
        totalHours:
          type: number
        billableHours:
          type: number
        nonBillableHours:
          type: number

    MyReportSummary:
      type: object
      required: [workingDays, leaveDays, availableDays, targetHours, totalHours, billableHours, nonBillableHours, utilization, efficiency]
      properties:
        workingDays:
          type: integer
        leaveDays:
          type: integer
        availableDays:
          type: integer
        targetHours:
          type: number
        totalHours:
          type: number
        billableHours:
          type: number
        nonBillableHours:
          type: number
        utilization:
          type: number
          description: "billableHours / targetHours × 100"
        efficiency:
          type: number
          description: "billableHours / totalHours × 100"

    MyReport:
      type: object
      required: [entries, summary]
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/MyReportRow"
        summary:
          $ref: "#/components/schemas/MyReportSummary"

    # ─── Leaves ───────────────────────────────────────────────────────────
    Leave:
      type: object
      required: [id, userId, userName, userRole, date, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: integer
        userName:
          type: string
        userRole:
          type: string
        date:
          type: string
          format: date
        note:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    LeaveInput:
      type: object
      required: [date]
      properties:
        date:
          type: string
          format: date
        note:
          type: string

    LeaveBulkInput:
      type: object
      required: [dates]
      properties:
        dates:
          type: array
          items:
            type: string
            format: date
          minItems: 1
        note:
          type: string

    LeaveBulkResult:
      type: object
      required: [created, skipped]
      properties:
        created:
          type: array
          items:
            $ref: "#/components/schemas/Leave"
        skipped:
          type: array
          description: Dates that already had a leave logged (duplicates ignored)
          items:
            type: string
            format: date
