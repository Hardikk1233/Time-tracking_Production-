# Runs on every pull request and every push to main.
#
# Nothing here touches Azure - it is the gate that decides whether a change is
# allowed to become a deployment. The security suite runs here too, so the
# holes closed in Phase 1 cannot quietly reopen.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # A newer push supersedes an in-flight run on the same branch.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        # The suite builds its own throwaway database from the real migrations,
        # so the triggers and constraints under test are the production ones.
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/timetracker_test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build library declarations
        run: pnpm run typecheck:libs

      - name: Typecheck
        run: |
          pnpm --filter @workspace/api-server run typecheck
          pnpm --filter @workspace/time-tracker run typecheck
          pnpm --filter @workspace/scripts run typecheck

      - name: Test
        run: pnpm --filter @workspace/api-server run test

      - name: Build frontend
        run: pnpm --filter @workspace/time-tracker run build

      - name: Build API
        run: pnpm --filter @workspace/api-server run build

      - name: Validate infrastructure template
        run: az bicep build --file infra/main.bicep --stdout > /dev/null

  image:
    name: Container image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Only worth the minutes once the code itself is known good.
    needs: verify

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          # The workspace prunes non-x64 native binaries, so other
          # architectures cannot resolve a complete dependency tree.
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
